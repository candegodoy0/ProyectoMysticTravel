{% extends 'base.html' %}
{% load static %}

{% block title %}Registro de Usuario - Mystic Travel{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'landing/css/landing.css' %}">
{% endblock %}

{% block content %}
<section class="auth-main content-start-offset"> 
    <h2 class="section-title">Crear una Cuenta de Administración</h2>

    <div class="auth-form bg-textura">
        <form method="post" novalidate>
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn-primary">REGISTRARME</button>
        </form>

        <p class="mt-3">
            ¿Ya tienes una cuenta? <a href="{% url 'landing:login' %}">Inicia Sesión aquí.</a>
        </p>
    </div>
</section>
{% endblock %}
